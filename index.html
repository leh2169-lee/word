<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>국어 - '누가'를 찾아요 (초심플 버전)</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: #FFFFFF; color: #111827;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* 1. 상단 한 줄 컨트롤 바 (심플 & 미니멀) */
    header {
      background: #F1F5F9; border-bottom: 2px solid #E2E8F0; padding: 8px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .tabs, .students { display: flex; gap: 6px; align-items: center; }
    .btn-tab {
      background: #FFFFFF; color: #475569; border: 2px solid #CBD5E1;
      padding: 6px 14px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .btn-tab.active { background: #2563EB; color: #FFFFFF; border-color: #2563EB; }

    .btn-stu {
      background: #FFFFFF; color: #475569; border: 2px solid #CBD5E1;
      padding: 5px 10px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer;
    }
    .btn-stu.active { background: #16A34A; color: #FFFFFF; border-color: #16A34A; }
    .btn-util {
      background: #475569; color: white; border: none; padding: 6px 10px;
      font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer;
    }

    /* 태블릿 잠금 모드 */
    #unlockBtn {
      display: none; position: fixed; top: 10px; right: 12px; z-index: 80;
      background: #F1F5F9; color: #64748B; border: 1px solid #CBD5E1;
      padding: 5px 10px; border-radius: 12px; font-size: 0.85rem; cursor: pointer;
    }
    body.locked header { display: none !important; }
    body.locked #unlockBtn { display: block; }

    /* 2. 중앙 학습 공간 (여백 극대화, 방해 자극 제로) */
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 20px; max-width: 960px; width: 100%; margin: 0 auto;
    }

    /* 상단 질문 표시줄 */
    .prompt-bar {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; margin-bottom: 24px; gap: 12px;
    }
    .nav-arrow {
      background: #F8FAFC; border: 2px solid #CBD5E1; color: #334155;
      font-size: 1.3rem; font-weight: bold; width: 48px; height: 48px;
      border-radius: 12px; cursor: pointer;
    }
    .prompt-text {
      font-size: 1.8rem; font-weight: 900; color: #1E293B; text-align: center; flex: 1;
    }

    /* 단일 학습 박스 (가수준 & 복습) */
    .single-box {
      width: 100%; border: 4px solid #E2E8F0; border-radius: 28px;
      padding: 40px 20px; text-align: center; background: #FFFFFF;
    }

    /* 시각 자료 (이모지 + 빈 이미지 태그) */
    .emoji-art { font-size: 8.5rem; line-height: 1.1; margin-bottom: 20px; cursor: pointer; }
    .custom-img { max-height: 200px; border-radius: 16px; display: none; margin: 0 auto 20px; object-fit: contain; }

    /* 문장 텍스트 */
    .sentence {
      font-size: 3.4rem; font-weight: 900; display: flex; align-items: center;
      justify-content: center; gap: 16px; flex-wrap: wrap;
    }
    .who-word {
      color: #D97706; background: #FEF3C7; padding: 4px 20px;
      border-radius: 16px; border: 4px solid #F59E0B;
    }

    /* 가수준 입력창 */
    .type-input {
      font-size: 3rem; font-weight: 900; text-align: center; width: 250px;
      padding: 6px 12px; border: 4px solid #2563EB; border-radius: 16px;
      background: #EFF6FF; color: #1E293B; outline: none;
    }
    .btn-ok {
      font-size: 1.8rem; font-weight: bold; background: #2563EB; color: white;
      border: none; padding: 12px 24px; border-radius: 16px; cursor: pointer;
    }
    .feedback-msg { margin-top: 16px; font-size: 1.4rem; font-weight: bold; color: #DC2626; min-height: 34px; }

    /* 다수준(나수준 통합) 2분할 카드 */
    .two-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; width: 100%; }
    .card-btn {
      background: #FFFFFF; border: 5px solid #CBD5E1; border-radius: 28px;
      padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.15s;
    }
    .card-btn:hover, .card-btn:active { border-color: #2563EB; background: #F8FAFC; }
    .card-label { font-size: 3.2rem; font-weight: 900; margin-top: 16px; color: #111827; }

    /* 0번 개념 설명 3분할 */
    .concept-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; width: 100%; margin-bottom: 24px; }
    .concept-item { border: 3px solid #E2E8F0; border-radius: 20px; padding: 24px 16px; text-align: center; cursor: pointer; }
    .concept-item h3 { font-size: 1.5rem; color: #2563EB; margin: 10px 0 6px; }
    .concept-item p { font-size: 1.15rem; color: #475569; line-height: 1.4; }

    /* 칭찬 토스트 및 IEP 모달 */
    #toast {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 4rem; font-weight: 900; background: #FFFFFF; padding: 35px 60px;
      border-radius: 30px; border: 8px solid #F59E0B; box-shadow: 0 20px 50px rgba(0,0,0,0.25); z-index: 90;
    }
    #iepModal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal-box { background: white; padding: 24px; border-radius: 20px; width: 580px; max-width: 92%; }
    textarea { width: 100%; height: 220px; font-size: 1rem; padding: 10px; margin: 12px 0; }
  </style>
</head>
<body>

  <button id="unlockBtn" onclick="document.body.classList.remove('locked')">🔓 메뉴 열기</button>

  <!-- 상단 바: 꼭 필요한 탭 4개 + 학생 선택 -->
  <header>
    <div class="tabs">
      <button class="btn-tab active" onclick="setMode(0)">[0] 개념설명</button>
      <button class="btn-tab" onclick="setMode(1)">[1] 가수준 (쓰기)</button>
      <button class="btn-tab" onclick="setMode(2)">[2] 다·나수준 (선택·말하기)</button>
      <button class="btn-tab" onclick="setMode(3)">[3] 복습퀴즈</button>
    </div>
    <div class="students" id="stuBar"></div>
  </header>

  <!-- 중앙 메인 화면 -->
  <main id="stage"></main>

  <div id="toast">🎉 참 잘했어요!</div>

  <!-- IEP 기록 모달 -->
  <div id="iepModal">
    <div class="modal-box">
      <h2>📊 오늘 수업 IEP 기록</h2>
      <textarea id="iepText" readonly></textarea>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button onclick="copyIEP()" style="padding:8px 16px; background:#2563EB; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">복사하기</button>
        <button onclick="clearIEP()" style="padding:8px 16px; background:#64748B; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">초기화</button>
        <button onclick="document.getElementById('iepModal').style.display='none'" style="padding:8px 16px; border-radius:8px; cursor:pointer;">닫기</button>
      </div>
    </div>
  </div>

<script>
/* =========================================================
   ★ [수업 데이터] 
   - 누가 봐도 100% 구별되는 4명의 인물(아기, 할머니, 선생님, 경찰관)로 통일!
   - imgUrl에 사진 주소를 넣으면 이모지 대신 사진이 나옵니다.
   ========================================================= */
const LESSONS = [
  {
    action: "밥을 먹어요.",
    subjects: [
      { who: "아기가",   emoji: "👶", imgUrl: "" },
      { who: "할머니가", emoji: "👵", imgUrl: "" },
      { who: "선생님이", emoji: "👩‍🏫", imgUrl: "" },
      { who: "경찰관이", emoji: "👮‍♂️", imgUrl: "" }
    ]
  },
  {
    action: "손을 씻어요.",
    subjects: [
      { who: "할머니가", emoji: "👵", imgUrl: "" },
      { who: "아기가",   emoji: "👶", imgUrl: "" },
      { who: "경찰관이", emoji: "👮‍♂️", imgUrl: "" },
      { who: "선생님이", emoji: "👩‍🏫", imgUrl: "" }
    ]
  },
  {
    action: "책을 읽어요.",
    subjects: [
      { who: "선생님이", emoji: "👩‍🏫", imgUrl: "" },
      { who: "경찰관이", emoji: "👮‍♂️", imgUrl: "" },
      { who: "할머니가", emoji: "👵", imgUrl: "" },
      { who: "아기가",   emoji: "👶", imgUrl: "" }
    ]
  },
  {
    action: "버스에 타요.",
    subjects: [
      { who: "경찰관이", emoji: "👮‍♂️", imgUrl: "" },
      { who: "선생님이", emoji: "👩‍🏫", imgUrl: "" },
      { who: "아기가",   emoji: "👶", imgUrl: "" },
      { who: "할머니가", emoji: "👵", imgUrl: "" }
    ]
  }
];

let mode = 0;   // 0:개념, 1:가수준, 2:다·나수준, 3:복습퀴즈
let step = 0;   // 문항 번호 (0~3)
let subIdx = 0; // 주인공 번호 (0~3)
let curStu = 0;
let leftFn = null, rightFn = null;

let students = JSON.parse(localStorage.getItem('minimal_stu')) || ["학생A","학생B","학생C","학생D","학생E","학생F"];
let logs = JSON.parse(localStorage.getItem('minimal_logs')) || [];

function renderStudents() {
  document.getElementById('stuBar').innerHTML = students.map((n, i) => 
    `<button class="btn-stu ${i === curStu ? 'active' : ''}" onclick="curStu=${i};renderStudents()" ondblclick="renameStu(${i})">${n}</button>`
  ).join('') + `
    <button class="btn-util" onclick="document.body.classList.add('locked')">🔒 잠금</button>
    <button class="btn-util" style="background:#E11D48;" onclick="openIEP()">📊 기록</button>
  `;
}

function renameStu(i) {
  const n = prompt("학생 이름 수정:", students[i]);
  if (n && n.trim()) { students[i] = n.trim(); localStorage.setItem('minimal_stu', JSON.stringify(students)); renderStudents(); }
}

// 빈 <img> 태그가 항상 포함된 시각 요소
function getVisual(sub) {
  const hasImg = sub.imgUrl && sub.imgUrl.trim() !== "";
  return `
    <img src="${sub.imgUrl}" class="custom-img" style="display:${hasImg ? 'block' : 'none'}" alt="수업 이미지" />
    <div class="emoji-art" style="display:${hasImg ? 'none' : 'block'}">${sub.emoji}</div>
  `;
}

function getHeaderBar(text) {
  return `
    <div class="prompt-bar">
      <button class="nav-arrow" onclick="moveStep(-1)">◀</button>
      <div class="prompt-text">${text}</div>
      <button class="nav-arrow" onclick="moveStep(1)">▶</button>
    </div>
  `;
}

function renderStage() {
  const item = LESSONS[step];
  const cur = item.subjects[subIdx % item.subjects.length];
  const other = item.subjects[(subIdx + 1) % item.subjects.length];
  const stage = document.getElementById('stage');
  leftFn = null; rightFn = null;

  document.querySelectorAll('.btn-tab').forEach((b, i) => b.classList.toggle('active', i === mode));

  if (mode === 0) {
    // [0] 개념 설명 (가장 깨끗한 3칸 요약 + 시연)
    stage.innerHTML = `
      <div class="prompt-text" style="margin-bottom:20px;">💡 문장에서 '누가'란 무엇일까요?</div>
      <div class="concept-grid">
        <div class="concept-item" onclick="speak('첫째, 누가 는 행동하는 주인공 사람이에요.')">
          <div style="font-size:3.5rem;">👶👵👩‍🏫👮‍♂️</div>
          <h3>① 주인공 사람</h3>
          <p>문장 맨 앞에서 행동하는<br><b>사람</b>을 알려줘요.</p>
        </div>
        <div class="concept-item" onclick="speak('둘째, 이름 뒤에 가 또는 이 가 붙어요.')">
          <div style="font-size:3rem; font-weight:900; color:#D97706;">~가 / ~이</div>
          <h3>② 끝에 '가 / 이'</h3>
          <p>할머니<b>가</b>, 경찰관<b>이</b>처럼<br>말 끝에 <b>가/이</b>가 붙어요.</p>
        </div>
        <div class="concept-item" onclick="speak('셋째, 누가 가 바뀌면 주인공이 달라져요.')">
          <div style="font-size:3.5rem;">🔄</div>
          <h3>③ 주인공이 휙!</h3>
          <p>뒤는 그대로인데<br><b>'누가'만 바뀌면 내용이 달라져요.</b></p>
        </div>
      </div>
      <div class="single-box" onclick="doSpace()" style="padding:24px; cursor:pointer;">
        <div style="font-size:5rem;">${cur.emoji}</div>
        <div class="sentence" style="font-size:2.6rem; margin-top:10px;">
          <span class="who-word">${cur.who}</span> <span>${item.action}</span>
        </div>
      </div>
    `;
  }
  else if (mode === 1) {
    // [1] 가수준: 그림만 보고 힌트 없이 '누가' 직접 쓰기
    stage.innerHTML = `
      ${getHeaderBar(`그림을 보고 빈칸에 알맞은 말을 써 보세요. (${step + 1}/4)`)}
      <div class="single-box">
        <div onclick="speak('누가 ${item.action}')">${getVisual(cur)}</div>
        <div class="sentence">
          <input type="text" id="typeBox" class="type-input" autocomplete="off" spellcheck="false"
            onkeydown="if(event.key==='Enter'){event.stopPropagation();checkType('${cur.who}');}" />
          <span>${item.action}</span>
          <button class="btn-ok" onclick="checkType('${cur.who}')">확인</button>
        </div>
        <div id="fbMsg" class="feedback-msg"></div>
      </div>
    `;
  }
  else if (mode === 2) {
    // [2] 다·나수준 통합: 하얀 바탕에 깔끔한 카드 2개 (선택 후 교사와 직접 말하기)
    const isLeft = ((step + subIdx) % 2 === 0);
    const L = isLeft ? { ...cur, ok: true } : { ...other, ok: false };
    const R = isLeft ? { ...other, ok: false } : { ...cur, ok: true };

    leftFn = () => checkPick(L.ok, L.who);
    rightFn = () => checkPick(R.ok, R.who);

    stage.innerHTML = `
      ${getHeaderBar(`<span style="color:#D97706;">"${cur.who}"</span> ${item.action} (${step + 1}/4)`)}
      <div class="two-cards">
        <div class="card-btn" onclick="leftFn()">
          ${getVisual(L)}
          <div class="card-label">${L.who}</div>
        </div>
        <div class="card-btn" onclick="rightFn()">
          ${getVisual(R)}
          <div class="card-label">${R.who}</div>
        </div>
      </div>
    `;
  }
  else if (mode === 3) {
    // [3] 4종 복습 퀴즈 (1:OX / 2:빈칸 / 3:짝짓기 / 4:문장쓰기)
    if (step === 0) {
      const isMatch = (subIdx % 2 === 0);
      const word = isMatch ? cur.who : other.who;
      leftFn = () => checkQuiz(isMatch, cur.who);
      rightFn = () => checkQuiz(!isMatch, cur.who);
      stage.innerHTML = `
        ${getHeaderBar(`복습 1/4 [OX 퀴즈] 그림과 글자가 맞나요?`)}
        <div class="single-box" style="padding:25px;">
          ${getVisual(cur)}
          <div class="sentence" style="margin-bottom:24px;"><span class="who-word">${word}</span> <span>${item.action}</span></div>
          <div class="two-cards">
            <button class="card-btn" style="padding:20px; font-size:2.8rem; font-weight:900;" onclick="leftFn()">⭕ 맞아요</button>
            <button class="card-btn" style="padding:20px; font-size:2.8rem; font-weight:900;" onclick="rightFn()">❌ 달라요</button>
          </div>
        </div>
      `;
    } else if (step === 1) {
      leftFn = () => checkQuiz(true, cur.who);
      rightFn = () => checkQuiz(false, other.who);
      stage.innerHTML = `
        ${getHeaderBar(`복습 2/4 [빈칸 고르기] 빈칸에 누가 들어갈까요?`)}
        <div class="single-box" style="padding:25px;">
          ${getVisual(cur)}
          <div class="sentence" style="margin-bottom:24px;"><span class="who-word">❓</span> <span>${item.action}</span></div>
          <div class="two-cards">
            <button class="card-btn" style="padding:20px; font-size:2.8rem; font-weight:900;" onclick="leftFn()">${cur.who}</button>
            <button class="card-btn" style="padding:20px; font-size:2.8rem; font-weight:900;" onclick="rightFn()">${other.who}</button>
          </div>
        </div>
      `;
    } else if (step === 2) {
      leftFn = () => checkQuiz(false, other.who);
      rightFn = () => checkQuiz(true, cur.who);
      stage.innerHTML = `
        ${getHeaderBar(`복습 3/4 [단어-그림 연결] '${cur.who}' 그림을 찾으세요!`)}
        <div class="sentence" style="margin-bottom:20px;"><span class="who-word">${cur.who}</span> <span>${item.action}</span></div>
        <div class="two-cards">
          <div class="card-btn" onclick="leftFn()">${getVisual(other)}</div>
          <div class="card-btn" onclick="rightFn()">${getVisual(cur)}</div>
        </div>
      `;
    } else {
      stage.innerHTML = `
        ${getHeaderBar(`복습 4/4 [문장 쓰기] 그림을 보고 문장을 완성하세요!`)}
        <div class="single-box">
          ${getVisual(cur)}
          <div class="sentence">
            <input type="text" id="typeBox" class="type-input" style="width:450px;" placeholder="문장 전체 쓰기" autocomplete="off"
              onkeydown="if(event.key==='Enter'){event.stopPropagation();checkType('${cur.who}');}" />
            <button class="btn-ok" onclick="checkType('${cur.who}')">확인</button>
          </div>
          <div id="fbMsg" class="feedback-msg"></div>
        </div>
      `;
    }
  }
}

function speak(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = 0.88;
  window.speechSynthesis.speak(u);
}

// [Space] 키: 주인공('누가') 바꾸기
function doSpace() {
  const item = LESSONS[step];
  subIdx = (subIdx + 1) % item.subjects.length;
  renderStage();
  const cur = item.subjects[subIdx];
  if (mode === 1) {
    speak(`누가 ${item.action}`);
    const box = document.getElementById('typeBox');
    if (box) box.focus();
  } else {
    speak(`${cur.who} ${item.action}`);
  }
}

// 가수준 타이핑 채점 (조사 '~가 / ~이'까지 엄격 확인)
function checkType(targetWho) {
  const box = document.getElementById('typeBox');
  const fb = document.getElementById('fbMsg');
  if (!box) return;
  const val = box.value.trim().replace(/\./g, '');
  const root = targetWho.slice(0, -1);
  const cleanAct = LESSONS[step].action.replace(/\./g, '').replace(/\s+/g, '');

  if (val === targetWho || val.replace(/\s+/g, '') === `${targetWho}${cleanAct}`) {
    speak(`정답입니다! ${targetWho} ${LESSONS[step].action}`);
    recordResult(true);
    setTimeout(() => doSpace(), 1500);
  } else if (val === root) {
    if (fb) fb.innerText = `💡 '${root}' 뒤에 '가' 또는 '이'를 붙여 써 보세요!`;
    speak(`${root} 맞아요! 뒤에 가 또는 이 를 붙여 보세요.`);
    box.focus();
  } else {
    if (fb) fb.innerText = `❓ 그림 속 사람이 누구인지(아기가, 할머니가, 선생님이, 경찰관이) 다시 확인해 보세요!`;
    speak(`그림 속 사람을 다시 확인해 보세요.`);
    box.focus();
  }
}

// 다·나수준 카드 선택 확인 (교사가 직접 따라 말하기를 지도할 수 있도록 정반응 후 문장 전체 또렷하게 출력)
function checkPick(isOk, word) {
  if (isOk) {
    speak(`딩동댕! ${word}! ${word} ${LESSONS[step].action}`);
    recordResult(true);
  } else {
    speak(`다시 찾아볼까요?`);
  }
}

function checkQuiz(isOk, word) {
  if (isOk) {
    speak(`정답입니다! ${word} ${LESSONS[step].action}`);
    recordResult(true);
  } else {
    speak(`다시 한번 생각해 볼까요?`);
  }
}

function recordResult(isSuccess) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    (isSuccess ? [523, 659, 784, 1046] : [440, 554]).forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.3);
      o.stop(ctx.currentTime + i * 0.08 + 0.3);
    });
  } catch(e) {}

  const t = document.getElementById('toast');
  t.innerHTML = isSuccess ? `🎉 ${students[curStu]} 최고!` : `🤝 ${students[curStu]} 함께 성공!`;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1200);

  const item = LESSONS[step];
  const cur = item.subjects[subIdx % item.subjects.length];
  const mNames = ["개념설명", "가수준(쓰기)", "다·나수준(선택·말하기)", "복습퀴즈"];
  logs.push(`[${new Date().toLocaleDateString('ko-KR')}] ${students[curStu]} | ${mNames[mode]} | '${cur.who} ${item.action}' -> ${isSuccess ? '독립수행' : '도움필요'}`);
  localStorage.setItem('minimal_logs', JSON.stringify(logs));
}

function setMode(m) {
  mode = m; renderStage();
  const item = LESSONS[step];
  const cur = item.subjects[subIdx % item.subjects.length];
  if (m === 0) speak("문장에서 행동하는 주인공 사람을 누가 라고 해요.");
  else if (m === 1) speak(`누가 ${item.action}`);
  else speak(`${cur.who} ${item.action}`);
}

function moveStep(dir) {
  step = (step + dir + LESSONS.length) % LESSONS.length;
  subIdx = 0; renderStage();
  const item = LESSONS[step];
  const cur = item.subjects[0];
  if (mode === 1) speak(`누가 ${item.action}`);
  else speak(`${cur.who} ${item.action}`);
}

function openIEP() {
  document.getElementById('iepText').value = logs.length ? logs.join('\n') : "기록이 없습니다. ([Enter]: 독립수행 / [Backspace]: 도움필요)";
  document.getElementById('iepModal').style.display = 'flex';
}
function copyIEP() {
  const t = document.getElementById('iepText'); t.select(); document.execCommand('copy');
  alert("복사되었습니다!");
}
function clearIEP() {
  if (confirm("초기화할까요?")) { logs = []; localStorage.removeItem('minimal_logs'); openIEP(); }
}

window.addEventListener('keydown', (e) => {
  if (document.activeElement.tagName === 'INPUT') {
    if (e.key === 'Escape') document.activeElement.blur();
    return;
  }
  if (['0','1','2','3'].includes(e.key)) setMode(Number(e.key));
  else if (e.key === 'Tab') { e.preventDefault(); curStu = (curStu + 1) % students.length; renderStudents(); }
  else if (e.key === 'ArrowRight') moveStep(1);
  else if (e.key === 'ArrowLeft') moveStep(-1);
  else if (e.key === 'ArrowUp' && leftFn) { e.preventDefault(); leftFn(); }
  else if (e.key === 'ArrowDown' && rightFn) { e.preventDefault(); rightFn(); }
  else if (e.code === 'Space') { e.preventDefault(); doSpace(); }
  else if (e.key === 'Enter') { e.preventDefault(); recordResult(true); }
  else if (e.key === 'Backspace') { e.preventDefault(); recordResult(false); }
  else if (e.key === 'i' || e.key === 'I') {
    const box = document.getElementById('typeBox');
    if (box) { e.preventDefault(); box.focus(); }
  }
});

renderStudents();
renderStage();
</script>
</body>
</html>
